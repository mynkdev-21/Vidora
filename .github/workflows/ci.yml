name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # Tests create and drop their own *_test databases; they never read .env secrets.
      - run: npm run test:coverage
      - name: Dependency audit (production, high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web dashboard build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_API_KEY: ci-placeholder-client-key
      - name: Dependency audit (production, high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidora-andoid
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # google-services.json is git-ignored; provide it as a base64 repository secret.
      - name: Restore google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
      - name: Skip notice
        if: env.HAS_GOOGLE_SERVICES != 'true'
        run: echo "::warning::GOOGLE_SERVICES_JSON secret not set — skipping the Android build."
      - name: Unit tests and debug build
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        env:
          VIDORA_API_KEY: ci-placeholder-client-key

  desktop:
    name: Desktop shell tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --lib
